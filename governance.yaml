# Agent governance policy.
#
# Classifies changed repository paths by risk and whether they require human
# review before an autonomous merge may proceed. Evaluated by
# scripts/agent-policy-eval (see that script's --self-test for the
# deterministic self-check).
#
# Patterns are POSIX ERE, matched with bash [[ =~ ]] against repo-relative
# paths, in the same anchoring style as the path classes in
# model-routing.yaml. The first matching rule wins; a path that matches no
# rule falls back to `default`.
#
# Deny by default: any path not explicitly allowlisted below requires human
# review, the same stance model-routing.yaml takes for unclassified paths.
# Only plain prose (docs/, README.md) and run-produced learning candidates
# are low risk. Protected-path rules come first so their reasons are the
# ones reported.
#
# How this is used: advisory for *blocking* (nothing in CI or branch
# protection reads it), authoritative for *granting* (agent-merge-gate and
# agent-review-stage refuse an autonomous merge when any path here requires
# review). Models must not edit this file (or the evaluator) to grant
# themselves additional autonomy.
version: 1

default:
  risk: medium
  requires_human_review: true
  reason: "Not on the low-risk allowlist (deny by default)."

rules:
  - pattern: (^|/)secrets/
    risk: high
    requires_human_review: true
    reason: "Encrypted secrets material."
  - pattern: \.sops\.yaml$
    risk: high
    requires_human_review: true
    reason: "sops key/recipient policy controls who can decrypt secrets."
  - pattern: \.age$
    risk: high
    requires_human_review: true
    reason: "Age key material."
  - pattern: ^\.github/
    risk: high
    requires_human_review: true
    reason: "CI/CD workflows, actions, and repo ownership control automation trust boundaries."
  - pattern: ^(governance\.yaml|model-routing\.yaml|capability-profiles\.yaml|scripts/agent-[^/]+|orchestration/agent-.*\.sh|install\.sh|check-flake-outputs\.sh|CLAUDE\.md|\.claude/.+|\.codex/.+|\.githooks/.+)$
    risk: high
    requires_human_review: true
    reason: "Agent workflow policy, control-plane scripts, instructions, or harness config; models must not grant themselves authority here."
  - pattern: ^(schemas/|canaries/|learning/scripts/|repo-map/scripts/|skills/|flake\.(nix|lock)$|examples/)
    risk: high
    requires_human_review: true
    reason: "Evidence contracts, canaries, agent skills, or the consumer supply chain; these decide what later checks trust."
  - pattern: ^learning/candidates/archive/
    risk: high
    requires_human_review: true
    reason: "Promoted learnings are injected into future agent prompts; promotion is a prompt-policy change."
  - pattern: ^(LICENSE|SECURITY\.md|CONTRIBUTING\.md|CODE_OF_CONDUCT\.md)$
    risk: medium
    requires_human_review: true
    reason: "Public legal/security-policy commitment; needs a human sign-off before merge."
  # Low-risk allowlist. Everything else falls through to the deny default.
  - pattern: ^(docs/[^/]+\.md|README\.md)$
    risk: low
    requires_human_review: false
    reason: "Prose documentation."
  - pattern: ^learning/candidates/[^/]+\.yml$
    risk: low
    requires_human_review: false
    reason: "Captured learning candidate; inert until a human-reviewed PR promotes it into archive/."
